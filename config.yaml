# ═══════════════════════════════════════════════════════════
# quant-starter 统一配置 (v2.0 — 2026-08-01 重构)
# 唯一配置源。所有代码从此文件读取。
# 修改此文件后必须更新 blind_test.config_hash。
# ═══════════════════════════════════════════════════════════

# ── 数据分区 (唯一合法定义, 与 DEVELOPMENT_DISCIPLINE.md v2 同步) ──
data_partition:
  research:    {start: "2018-01-01", end: "2022-12-31"}  # 因子开发、IC计算
  development: {start: "2023-01-01", end: "2024-06-30"}  # 组合验证、参数调优
  test:        {start: "2024-07-01", end: "2025-06-30"}  # 最终测试 (只跑一次)
  blind:       {start: "2025-07-01", end: "2026-07-31"}  # 模拟盘跟踪 (永不回测)
  full_start: "2018-01-01"
  full_end: "2026-07-31"

# ── 盲测状态 ──
blind_test:
  locked: true
  contaminated: true  # 旧blind期(2024-07~2026-07)已被污染(trial_count=3)
  note: "新blind期从2025-07-01开始, 旧结果全部作废"

# ── 执行参数 ──
execution:
  initial_capital: 100000
  lot_size: 100
  top_k: 30                    # 持仓数量
  max_positions: 40            # 最大持仓上限
  max_single_pct: 0.25         # 单票仓位上限
  slippage_bps: 30             # 滑点 (小盘股30bp)
  commission_buy: 0.00025      # 买入手续费
  commission_sell: 0.00075     # 卖出手续费 (含印花税)
  signal_delay: 1              # T+1信号延迟
  execution_price: open        # 成交价: 次日开盘
  turnover_limit_pct: 0.5      # 月单边换手≤50%

# ── 模型参数 (教训#6: 极端正则化) ──
model:
  type: linear                 # 生产路径: IC加权线性 (不用ML)
  # 以下为研究用ML参数 (model/pipeline.py 使用, 非生产路径)
  research_lgb:
    n_estimators: 50
    max_depth: 2
    min_data_in_leaf: 200
    lambda_l1: 1.0
    lambda_l2: 1.0
    learning_rate: 0.05
    early_stopping_rounds: 10

# ── 因子配置 ──
factors:
  preset: ic_auto
  use_fundamental: false       # 基本面数据就绪后改为 true
  corr_threshold: 0.6          # 独立性剪枝阈值 (从0.4放宽到0.6)

# ── 标签 ──
label:
  horizon_days: 20
  type: rank

# ── 滚动验证 ──
rolling:
  train_months: 4
  test_months: 9
  embargo_days: 30
  day_step: 2

# ── 组合管理 ──
portfolio:
  hold_thresh: 30              # 月度调仓
  sector_neutral: true
  buy_confirm_days: 1
  sell_rank_buffer: 2
  n_drop: 2

# ── 时间衰减 ──
time_decay:
  half_life_years: 0.5

# ── Universe ──
universe:
  index: "all_cached"
  include_delisted: true
  min_list_days: 250
  snapshot_mode: monthly
  data_version: v20260801

# ── 券商执行 (QMT/miniQMT 仿真盘) ──
# adapter: paper=内置模拟(默认), qmt=券商仿真环境(需完成下方配置)
# 启用步骤: 1) 券商开通QMT权限 2) 安装登录QMT客户端 3) 填下方 qmt 段
#          4) 确认 execution/broker/qmt.py 已实现真实连接(未实现前保持 paper)
broker:
  adapter: "paper"             # paper 或 qmt
  qmt:
    path: ""                   # xtquant 包所在目录, 如 C:\...\QMT安装目录\bin.x64\xtquant
    account: ""                # 资金账号 (QMT 客户端登录账号)
    session_id: 1              # 会话ID, 任意整数, 本机唯一即可
    mode: "simulate"           # simulate=仿真盘(先用这个), real=实盘(风险自负)
