# Deep Quant v2 — 唯一参数源
# 所有参数从此文件读取，不再散落在各 py 文件的全局变量里。
# 修改参数后运行: python scripts/run_backtest.py

# ════════════════════════════════════════
#  数据分区 (严禁修改 — 一旦确定永不回头)
# ════════════════════════════════════════
data_partition:
  full_start: "2018-01-01"
  full_end: "2026-07-10"
  research:
    start: "2018-01-01"
    end: "2022-12-31"       # 因子研究、IC分析只能用这个区间
  development:
    start: "2023-01-01"
    end: "2024-06-30"       # 模型开发、超参调优用这个区间
  blind_test:
    start: "2024-07-01"
    end: "2026-07-10"       # ★ 盲测期：参数冻结后只能跑一次，结果即为最终答案

# ════════════════════════════════════════
#  股票池 (Point-in-Time 成分股)
# ════════════════════════════════════════
universe:
  index: "000300"           # CSI300
  snapshot_mode: "monthly"  # 每月取一次当时的成分股快照
  min_list_days: 250        # 上市满250个交易日的才纳入
  include_delisted: true    # 包含已退市股（必须有历史数据）
  data_version: "v20260729" # 数据快照版本

# ════════════════════════════════════════
#  滚动重训练窗口
# ════════════════════════════════════════
rolling:
  train_months: 12          # 训练窗口长度
  test_months: 9            # 测试窗口长度
  day_step: 2               # 每N天采样
  embargo_days: 20          # ★ 训练末尾扣掉的标签前瞻天数（防穿越）

# ════════════════════════════════════════
#  标签
# ════════════════════════════════════════
label:
  horizon_days: 20          # 前瞻N日收益
  type: "rank"              # cross-sectional rank

# ════════════════════════════════════════
#  模型 (LightGBM Lambdarank)
# ════════════════════════════════════════
model:
  n_estimators: 200
  max_depth: 5
  learning_rate: 0.05
  lambda_l1: 0.8
  min_data_in_leaf: 60
  val_ratio: 0.15           # 验证集占比（按日期组分割）

# ════════════════════════════════════════
#  时间衰减
# ════════════════════════════════════════
time_decay:
  half_life_years: 0.5      # 半衰期（0.5年前的数据权重折半）

# ════════════════════════════════════════
#  执行规则 (A股真实约束)
# ════════════════════════════════════════
execution:
  signal_delay: 1           # T+1: 今天收盘确认信号 → 明天开盘成交
  execution_price: "open"   # 次日开盘价
  initial_capital: 100000
  top_k: 5                  # 持仓数量
  max_single_pct: 0.25      # 单票最大仓位占比
  lot_size: 100             # A股整手

# ════════════════════════════════════════
#  组合管理
# ════════════════════════════════════════
portfolio:
  hold_thresh: 10           # 最小持有天数
  sell_rank_buffer: 2       # 排名跌出 top_k+buffer 才卖
  buy_confirm_days: 1       # 连续N天在top_k才买
  cost_threshold: 0.08      # 新股分数须超旧股(1+threshold)才换
  n_drop: 3                 # 每天最多替换数
  sector_neutral: false     # 行业中性化

# ════════════════════════════════════════
#  因子配置
# ════════════════════════════════════════
factors:
  preset: "ic_optimized"    # 因子预设（必须在研究期生成并冻结）
  freeze_date: "2023-01-01" # ★ 此后不再修改因子列表或权重

# ════════════════════════════════════════
#  盲测追踪
# ════════════════════════════════════════
blind_test:
  trial_count: 0            # ★ 已运行盲测次数（每跑一次 +1，DSR 用此数校正）
  last_run: null            # 上次盲测时间
  locked: false             # 参数是否已锁定（true 后禁止修改 config）
