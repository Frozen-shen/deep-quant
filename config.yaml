# ═══════════════════════════════════════════════════════════
# quant-starter 统一配置 (v2.0 — 2026-08-01 重构)
# 唯一配置源。所有代码从此文件读取。
# 修改此文件后必须更新 blind_test.config_hash。
# ═══════════════════════════════════════════════════════════

# ── 数据分区 v5 (2026-08-09 滚动演进) ──
# TEST① = 2025-01~2026-06 (v6/v7 已测2次, 检验价值耗尽, 2026-08-09 毕业并入 research)
# TEST② = 2026-07~2026-12 (数据积累中, 只跑一次, 由 lock 机制保护)
# blind = 2027+ 永不回测; 行业依据: QuantConnect WFO 滚动窗口 + WorldQuant 回测→模拟→实盘
data_partition:
  research:    {start: "2015-01-01", end: "2026-06-30"}  # 因子开发 + WF folds (含毕业TEST①)
  development: {start: "2026-07-01", end: "2026-12-31"}  # TEST② (holdout, 数据积累中, 只跑一次)
  test:        {start: "2026-07-01", end: "2026-12-31"}  # 与 development 同区间 (TEST②)
  blind:       {start: "2027-01-01", end: "2027-12-31"}  # 模拟盘跟踪 (永不回测)
  full_start: "2015-01-01"
  full_end: "2026-12-31"

# ── 盲测状态 ──
blind_test:
  locked: false
  contaminated: false
  note: "v5演进: blind=2027+, daily_pipeline每日跟踪; TEST①(2025-01~2026-06)已毕业; TEST②=2026-07~12只跑一次"
  blind_start: "2027-01-01"
  protocol: "daily_pipeline自动运行, 禁止手动回测, 2028-01-01后评估"

# ── 流通股本补拉 (fixA) ──
# fetch_daily_data.py --fetch-shares 模式的参数。
# 原理: 换手率 turn(%) = 日成交量(股) / 流通股本 * 100, 按年取中位数反推。
shares_fetch:
  start_date: "2015-01-01"    # 与 data_partition.full_start 一致
  end_date: "2026-07-31"      # 与日线数据末端一致
  rate_limit_sleep: 0.3       # baostock 请求间隔 (s)
  batch_size: 100             # 每 N 只重连 baostock (防会话超时)

# ── 执行参数 ──
execution:
  initial_capital: 300000       # 2026-08-15 决策: 10万→30万 (top_k=10, 每只3万跨最低佣金门槛)
  lot_size: 100
  top_k: 20                    # 持仓数量 (2026-08-16 敏感性重决策: 10=+2.1%/Sharpe0.46,
                               #   20=+11.4%/0.78最优, 30=+9.4%/0.75; 10 过度集中)
  max_positions: 40            # 最大持仓上限
  max_single_pct: 0.25         # 单票仓位上限
  slippage_bps: 30             # 滑点 (小盘股30bp)
  commission_buy: 0.00025      # 买入手续费
  commission_sell: 0.00075     # 卖出手续费 (含印花税)
  signal_delay: 1              # T+1信号延迟
  execution_price: pov         # 回测成交价: pov=成交量比例拆单(v24e, 2022+分钟数据, 之前回退vwap)
                               #   vwap=次日VWAP(旧) / open=次日开盘(更旧)
  vwap_residual_bps: 10        # VWAP/POV残差滑点 (bps, 拆单无法完美命中均价)
  minute_mode: true            # 模拟盘执行: 用分钟线POV/VWAP/TWAP成交 (2026-08-12启用,
                               #   MinuteFetcher 已接入 data_store/minute_5m 全历史 5055只)
  execution_algo: pov          # 分钟执行算法: pov=成交量比例参与(跟随市场节奏, 推荐)
                               #   / vwap=量加权 / twap=时间加权
  twap_slices: 8               # TWAP 拆分段数 (~每30分钟一段, POV下忽略)
  turnover_limit_pct: 0.5      # 月单边换手≤50%
  rebalance_days: 20           # 调仓间隔 (交易日): v22 C1实验(周频5) 淘汰:
                               #   期换手上限12% vs 策略自然换手18-38% → 98%调仓被跳过,
                               #   周频在月50%换手纪律下不可行 (2026-08-11)

# ── 模型参数 (教训#6: 极端正则化) ──
model:
  type: linear                 # 生产路径: IC加权线性 (不用ML)
  # 以下为研究用ML参数 (model/pipeline.py 使用, 非生产路径)
  research_lgb:
    n_estimators: 50
    max_depth: 2
    min_data_in_leaf: 200
    lambda_l1: 1.0
    lambda_l2: 1.0
    learning_rate: 0.05
    early_stopping_rounds: 10

# ── 因子配置 ──
factors:
  preset: ic_auto
  use_fundamental: false       # 基本面数据就绪后改为 true
  corr_threshold: 0.6          # 独立性剪枝阈值 (从0.4放宽到0.6)

# ── 分钟因子 (方案C v5, 数据2022起, fold 3-5 可用) ──
minute_factors:
  enabled: true
  lookback: 20
  freq: "15"            # 生产用15分钟 (v19实验2026-08-11: 5m模拟考-2.9% vs 15m +0.7%, 淘汰; v7同结论)

# ── 分钟因子叠加层 (方案B, 2026-08-04) ──
minute_layer:
  enabled: true        # 总开关: false 时行为与 v5 完全一致
  lambda: 0.3          # 叠加权重 (综合分 = 主分 + λ×分钟分)
  min_icir: 0.3        # 分钟因子保留的 ICIR 门槛
  validate_folds: [4, 5]  # 独立验证使用的 fold 训练期

# ── 回测模式 (2026-08-15: 唯一默认源, CLI 显式传参时覆盖) ──
# 标准流程: py scripts/active/run_walkforward_backtest.py (零参数, 自动读本段)
backtest:
  mode: "folds"            # folds=方案C 5折Walk-Forward / rolling=滚动ICIR / dev=仅development
  folds_only: true         # true=不执行终极 TEST (不消耗 TEST 锁, 日常验证)
  liquid: true             # true=流动性PIT universe (全市场+过滤)
  extend_val: ["2025-01-01", "2026-06-30"]   # fold 后扩展模拟考区间 (TEST① 毕业数据)

# ── Fold 筛选 (方案C) ──
fold:
  max_factors: 50          # 稳定因子数量上限 (v9实验: 40→50, 2026-08-07)
  style_cap: 0.4           # 风格预算 (2026-08-16 v29): 同家族因子|权重|之和上限

# ── 组合层优化 (v9b) ──
portfolio_optimizer: "equal"   # equal=等权 / inv_vol=波动率倒数加权 (v9b实验) / risk_parity=风险平价 (P0)

# ── 多风格 sleeve (2026-08-16 实验; enabled=false 时公式与 v27 一致 (float64 计算路径, 差异 ≤1e-7 量级)) ──
styles:
  enabled: false
  budgets:                 # 组合分 = (1-Σbudget)×核心 + Σ budget×sleeve分
    momentum: 0.25
    growth: 0.15
  sleeves:
    momentum:              # 5/5 fold 命中但被 top50 截断的动量因子
      min_hits: 3
      factors:
        - return_30d
        - return_60d
        - return_90d
        - vol_adj_mom_60d
        - momentum_7d
        - momentum_20d
        - mom_60d
        - mom_120d
        - mom_12_1
    growth:                # 成长 sleeve: 风格预算实验, 不强求 fold 命中
      min_hits: 0
      fallback_weight: 0.1  # fold 中位数 |ICIR|<0.02 时的默认权重 (符号取正, p6 ICIR 均为正)
      factors:
        - fund_profit_growth
        - fund_profit_growth_ded
        - fund_revenue_growth
        - aux_yjkb_profit_growth
        - fund_ocf_ps
        - fund_ocf_yield
        - fund_net_margin

# ── 股票池分域 (v10, 波动率分层×regime乘数, 设计文档 2026-08-09) ──
pool_filter:
  enabled: true           # 模拟考 on 组 (2026-08-09); false=对照组
  low_vol_mult: 1.5       # 高波动市场: 低波档乘数
  high_vol_mult: 0.5      # 高波动市场: 高波档乘数
  low_vol_up: 0.8         # 低波动市场: 低波档乘数 (牛市弹性)
  high_vol_up: 1.2        # 低波动市场: 高波档乘数

# ── 市场状态 (v20, 2026-08-11) ──
# vol_source: daily=指数日收益60日std (原逻辑); rv_5m=市场截面已实现波动率
#   (build_market_rv.py 产物, 全市场个股5m RV截面中位数, 2022起, 之前回退 daily)
regime:
  vol_source: "daily"    # v25组合实验后决策: v24b(仅VWAP)最优, rv_5m仅fold_3防守更强但EXTEND回落 → 生产 daily

# ── 标签 ──
label:
  horizon_days: 20
  type: rank

# ── 滚动验证 ──
rolling:
  train_months: 4
  test_months: 9
  embargo_days: 30
  day_step: 2

# ── 组合管理 ──
portfolio:
  hold_thresh: 30              # 月度调仓
  sector_neutral: true
  buy_confirm_days: 1
  sell_rank_buffer: 2
  n_drop: 2
  # 回测组合层参数 (2026-08-16 v27 定稿: 低换手配置启用, 单票 20% 上限已执行;
  # extend +93.6%/Sharpe2.17/DD-10.8%, 最大权重 17.3%, 见 AGENTS.md)
  bt_hold_thresh: 45
  bt_sell_rank_buffer: 6
  bt_n_drop: 6
  bt_buy_confirm_days: 2
  bt_cost_threshold: 0.08

# ── 时间衰减 ──
time_decay:
  half_life_years: 0.5

# ── Universe (方案C: 流动性PIT, 全市场+过滤) ──
universe:
  mode: "liquid"               # liquid=全市场+流动性过滤(推荐) / index=指数成分
  index: "all_cached"
  include_delisted: true
  min_list_days: 250           # 最少上市交易日 (~1年)
  min_avg_amount: 5000000      # 20日均成交额下限 (元)
  liquidity_lookback: 20       # 流动性回看窗口 (交易日)
  snapshot_mode: monthly
  data_version: v20260803

# ── 中性化 (方案C v5) ──
neutralization:
  enabled: true
  winsorize: "mad"          # mad=中位数绝对偏差去极值 / quantile=分位数
  winsorize_k: 3            # MAD 倍数
  industry_neutral: false   # 行业中性化实验(v8.1): fold均值+2.54%→-8.2%, 负贡献已回退 (2026-08-07)
  size_neutral: false       # 市值中性化 (需市值数据, 暂关)

# ── 组合后置约束 (方案C v5) ──
portfolio_constraints:
  max_single_pct: 0.20      # 单票仓位上限 20% (2026-08-16 v27 定稿: 5%→20%, 已验证最大权重 17.3%)
  max_industry_pct: 0.25    # 行业上限 25%
  max_turnover: 0.5         # 单期换手上限 50%

# ── 波动率目标仓位 (P0, 2026-08-09) ──
vol_target:
  enabled: true          # 实验时置 true
  target_pct: 0.70        # 目标波动率百分位
  max_scale: 1.0          # 满仓上限
  min_scale: 0.40         # 最低仓位

# ── 趋势择时 (阶段3, 2026-08-10): 保障熊市年化收益为正 ──
trend_timing:
  enabled: false          # v18 实验淘汰: 2022仍负+模拟考-12.2pp (2026-08-11)
  down_scale: 0.40        # 下跌趋势仓位 (熊市少亏)
  range_scale: 0.80       # 震荡市仓位

# ── 因子正交化 (P2, 2026-08-09) ──
factor_orthogonalize:
  enabled: false          # 实验时置 true (fold 前 Gram-Schmidt 去冗余)

# ── 券商执行 (QMT/miniQMT 仿真盘) ──
# adapter: paper=内置模拟(默认), qmt=券商仿真环境(需完成下方配置)
# 启用步骤: 1) 券商开通QMT权限 2) 安装登录QMT客户端 3) 填下方 qmt 段
#          4) 确认 execution/broker/qmt.py 已实现真实连接(未实现前保持 paper)
broker:
  adapter: "paper"             # paper 或 qmt
  qmt:
    path: ""                   # xtquant 包所在目录, 如 C:\...\QMT安装目录\bin.x64\xtquant
    account: ""                # 资金账号 (QMT 客户端登录账号)
    session_id: 1              # 会话ID, 任意整数, 本机唯一即可
    mode: "simulate"           # simulate=仿真盘(先用这个), real=实盘(风险自负)

# ── 东财接口代理 (cheapproxy akshare-proxy-patch) ──
# 背景: 东财对本地直连 IP 间歇性封禁 (2026-08 起直连 push2/push2his 频繁 RemoteDisconnected)。
# 用法: fetch_aux_factors_data.py / fetch_index_data.py 等检测到 enabled: true
#       自动在脚本顶部 install_patch, 请求经网关转发, 绕过本地 IP 封禁。
# 注意: 按积分计费 (akshare/efinance 接口 1~15 积分/次), 网关/TOKEN 从 cheapproxy 面板获取。
eastmoney_proxy:
  enabled: true
  gateway: "101.201.173.125"
  auth_token: "20260809YL16REJA"
  retry: 30
  # ⚠️ hook_domains 只保留 push2/push2his! (2026-08-09 深夜实测结论)
  # 加其他域名 (fund/push2ex/datacenter-web/emweb/searchapi) 会导致 efinance
  # 请求间歇性空返回 (get_quote_id 路由错误), 批量任务 100% 失败。
  # 需要代理的东财接口只有行情类 (kline/fflow 都在 push2/push2his)。
  hook_domains:
    - "push2.eastmoney.com"
    - "push2his.eastmoney.com"
