# ═══════════════════════════════════════════════════════════
# quant-starter 统一配置 (v2.0 — 2026-08-01 重构)
# 唯一配置源。所有代码从此文件读取。
# 修改此文件后必须更新 blind_test.config_hash。
# ═══════════════════════════════════════════════════════════

# ── 数据分区 v5 (2026-08-09 滚动演进) ──
# TEST① = 2025-01~2026-06 (v6/v7 已测2次, 检验价值耗尽, 2026-08-09 毕业并入 research)
# TEST② = 2026-07~2026-12 (数据积累中, 只跑一次, 由 lock 机制保护)
# blind = 2027+ 永不回测; 行业依据: QuantConnect WFO 滚动窗口 + WorldQuant 回测→模拟→实盘
data_partition:
  research:    {start: "2015-01-01", end: "2026-06-30"}  # 因子开发 + WF folds (含毕业TEST①)
  development: {start: "2026-07-01", end: "2026-12-31"}  # TEST② (holdout, 数据积累中, 只跑一次)
  test:        {start: "2026-07-01", end: "2026-12-31"}  # 与 development 同区间 (TEST②)
  blind:       {start: "2027-01-01", end: "2027-12-31"}  # 模拟盘跟踪 (永不回测)
  full_start: "2015-01-01"
  full_end: "2026-12-31"

# ── 盲测状态 ──
blind_test:
  locked: false
  contaminated: false
  note: "v5演进: blind=2027+, daily_pipeline每日跟踪; TEST①(2025-01~2026-06)已毕业; TEST②=2026-07~12只跑一次"
  blind_start: "2027-01-01"
  protocol: "daily_pipeline自动运行, 禁止手动回测, 2028-01-01后评估"

# ── 流通股本补拉 (fixA) ──
# fetch_daily_data.py --fetch-shares 模式的参数。
# 原理: 换手率 turn(%) = 日成交量(股) / 流通股本 * 100, 按年取中位数反推。
shares_fetch:
  start_date: "2015-01-01"    # 与 data_partition.full_start 一致
  end_date: "2026-07-31"      # 与日线数据末端一致
  rate_limit_sleep: 0.3       # baostock 请求间隔 (s)
  batch_size: 100             # 每 N 只重连 baostock (防会话超时)

# ── 执行参数 ──
execution:
  initial_capital: 100000
  lot_size: 100
  top_k: 30                    # 持仓数量
  max_positions: 40            # 最大持仓上限
  max_single_pct: 0.25         # 单票仓位上限
  slippage_bps: 30             # 滑点 (小盘股30bp)
  commission_buy: 0.00025      # 买入手续费
  commission_sell: 0.00075     # 卖出手续费 (含印花税)
  signal_delay: 1              # T+1信号延迟
  execution_price: open        # 成交价: 次日开盘
  turnover_limit_pct: 0.5      # 月单边换手≤50%

# ── 模型参数 (教训#6: 极端正则化) ──
model:
  type: linear                 # 生产路径: IC加权线性 (不用ML)
  # 以下为研究用ML参数 (model/pipeline.py 使用, 非生产路径)
  research_lgb:
    n_estimators: 50
    max_depth: 2
    min_data_in_leaf: 200
    lambda_l1: 1.0
    lambda_l2: 1.0
    learning_rate: 0.05
    early_stopping_rounds: 10

# ── 因子配置 ──
factors:
  preset: ic_auto
  use_fundamental: false       # 基本面数据就绪后改为 true
  corr_threshold: 0.6          # 独立性剪枝阈值 (从0.4放宽到0.6)

# ── 分钟因子 (方案C v5, 数据2022起, fold 3-5 可用) ──
minute_factors:
  enabled: true
  lookback: 20
  freq: "15"            # 生产用15分钟 (v7实验: 5分钟差异不显著且TEST点估计更差, 2026-08-07)

# ── 分钟因子叠加层 (方案B, 2026-08-04) ──
minute_layer:
  enabled: true        # 总开关: false 时行为与 v5 完全一致
  lambda: 0.3          # 叠加权重 (综合分 = 主分 + λ×分钟分)
  min_icir: 0.3        # 分钟因子保留的 ICIR 门槛
  validate_folds: [4, 5]  # 独立验证使用的 fold 训练期

# ── Fold 筛选 (方案C) ──
fold:
  max_factors: 50          # 稳定因子数量上限 (v9实验: 40→50, 2026-08-07)

# ── 组合层优化 (v9b) ──
portfolio_optimizer: "equal"   # equal=等权 / inv_vol=波动率倒数加权 (v9b实验)

# ── 股票池分域 (v10, 波动率分层×regime乘数, 设计文档 2026-08-09) ──
pool_filter:
  enabled: false          # v9 基线重跑 (配对bootstrap); false 时行为与 v9 完全一致
  low_vol_mult: 1.5       # 高波动市场: 低波档乘数
  high_vol_mult: 0.5      # 高波动市场: 高波档乘数
  low_vol_up: 0.8         # 低波动市场: 低波档乘数 (牛市弹性)
  high_vol_up: 1.2        # 低波动市场: 高波档乘数

# ── 标签 ──
label:
  horizon_days: 20
  type: rank

# ── 滚动验证 ──
rolling:
  train_months: 4
  test_months: 9
  embargo_days: 30
  day_step: 2

# ── 组合管理 ──
portfolio:
  hold_thresh: 30              # 月度调仓
  sector_neutral: true
  buy_confirm_days: 1
  sell_rank_buffer: 2
  n_drop: 2

# ── 时间衰减 ──
time_decay:
  half_life_years: 0.5

# ── Universe (方案C: 流动性PIT, 全市场+过滤) ──
universe:
  mode: "liquid"               # liquid=全市场+流动性过滤(推荐) / index=指数成分
  index: "all_cached"
  include_delisted: true
  min_list_days: 250           # 最少上市交易日 (~1年)
  min_avg_amount: 5000000      # 20日均成交额下限 (元)
  liquidity_lookback: 20       # 流动性回看窗口 (交易日)
  snapshot_mode: monthly
  data_version: v20260803

# ── 中性化 (方案C v5) ──
neutralization:
  enabled: true
  winsorize: "mad"          # mad=中位数绝对偏差去极值 / quantile=分位数
  winsorize_k: 3            # MAD 倍数
  industry_neutral: false   # 行业中性化实验(v8.1): fold均值+2.54%→-8.2%, 负贡献已回退 (2026-08-07)
  size_neutral: false       # 市值中性化 (需市值数据, 暂关)

# ── 组合后置约束 (方案C v5) ──
portfolio_constraints:
  max_single_pct: 0.05      # 单票仓位上限 5%
  max_industry_pct: 0.25    # 行业上限 25%
  max_turnover: 0.5         # 单期换手上限 50%

# ── 券商执行 (QMT/miniQMT 仿真盘) ──
# adapter: paper=内置模拟(默认), qmt=券商仿真环境(需完成下方配置)
# 启用步骤: 1) 券商开通QMT权限 2) 安装登录QMT客户端 3) 填下方 qmt 段
#          4) 确认 execution/broker/qmt.py 已实现真实连接(未实现前保持 paper)
broker:
  adapter: "paper"             # paper 或 qmt
  qmt:
    path: ""                   # xtquant 包所在目录, 如 C:\...\QMT安装目录\bin.x64\xtquant
    account: ""                # 资金账号 (QMT 客户端登录账号)
    session_id: 1              # 会话ID, 任意整数, 本机唯一即可
    mode: "simulate"           # simulate=仿真盘(先用这个), real=实盘(风险自负)
