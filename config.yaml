blind_test:
  config_hash: 9899faed0bf0
  last_run: '2026-07-30'
  locked: true
  trial_count: 3             # Trial#1(合法-19.1%) + Trial#2(v4作废) + Trial#3(本次污染)
data_partition:
  blind_test:
    end: '2026-07-10'
    start: '2024-07-01'
  development:
    end: '2024-06-30'
    start: '2021-01-01'
  full_end: '2026-07-10'
  full_start: '2018-01-01'
  research:
    end: '2022-12-31'
    start: '2018-01-01'
execution:
  execution_price: open
  initial_capital: 100000
  lot_size: 100
  market_filter: false
  market_ma: 60
  max_positions: 5
  max_single_pct: 0.25
  signal_delay: 1
  top_k: 30                 # ★ 宽度改造: 30只持仓
  max_positions: 40
  slippage_bps: 30           # ★ 小盘滑点30bp
  turnover_limit_pct: 0.5    # ★ 月单边换手≤50%
  pead_defense: false  # 坏消息CAR不显著(v2 p=0.82)         # ★ PEAD负面预告强制卖出
  # -- 分钟级执行 (模拟盘建议开启) --
  minute_mode: true          # true=分钟线VWAP/TWAP成交, false=日线开盘价
  minute_period: "5"         # 5分钟K线
  execution_algo: vwap       # vwap / twap / open / close
  twap_slices: 8             # TWAP拆单段数
factors:
  freeze_date: '2023-01-01'
  preset: ic_auto
  use_fundamental: false    # 校准阶段关闭, 纯价量基线
  pead_weight: 0.0          # PEAD 事件因子权重 (0=关闭, 建议0.10~0.20; alpha跑出后再调)
label:
  horizon_days: 20          # CSI1000低频信号
  type: rank
model:
  type: lgb                 # CSI1000换挡 + LightGBM
  lambda_l1: 0.3
  learning_rate: 0.03
  max_depth: 5
  min_data_in_leaf: 40
  n_estimators: 600
  ridge_alpha: 1.0          # 仅 l2 模式使用
  val_ratio: 0.15
portfolio:
  buy_confirm_days: 1
  cost_threshold: 0.08
  hold_thresh: 30           # ★ 宽度改造: 月度调仓
  n_drop: 2
  sector_neutral: true       # ★ 行业中性化
  sell_rank_buffer: 2
rolling:
  day_step: 2
  embargo_days: 30          # T+20标签, 30天embargo
  test_months: 9
  train_months: 4
time_decay:
  half_life_years: 0.5
universe:
  data_version: v20260729
  include_delisted: true
  index: 'all_cached'         # ★ 全部缓存股票(≈950只) 宽度改造
  min_list_days: 250
  snapshot_mode: monthly
