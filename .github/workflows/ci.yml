name: CI Lock Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check blind test lock integrity
        run: |
          pip install pyyaml -q
          # ── 优先检查 blind_lock.yaml (独立锁, 修改config绕不过) ──
          if [ -f blind_lock.yaml ]; then
            LOCK_LOCKED=$(python -c "
          import yaml
          with open('blind_lock.yaml') as f:
              lk = yaml.safe_load(f) or {}
          print(lk.get('locked', False))
          ")
            if [ "$LOCK_LOCKED" = "True" ]; then
              # 检查本次push是否动了 blind_lock.yaml 或 config.yaml
              if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -qE "blind_lock\.yaml|config\.yaml"; then
                echo "❌ 盲测已锁定 (blind_lock.yaml), 禁止修改 blind_lock.yaml 或 config.yaml"
                exit 1
              fi
              echo "✅ 盲测锁定状态正常 (blind_lock.yaml)"
            fi
          else
            # 回退: 检查 config.yaml 里的旧锁
            LOCKED=$(python -c "
          import yaml
          with open('config.yaml') as f:
              cfg = yaml.safe_load(f)
          print(cfg.get('blind_test',{}).get('locked',False))
          ")
            if [ "$LOCKED" = "True" ]; then
              if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q config.yaml; then
                echo "❌ 盲测已锁定, 禁止修改 config.yaml"
                exit 1
              fi
              echo "✅ 盲测锁定状态正常 (config.yaml)"
            fi
          fi

      - name: Run unit tests
        run: |
          pip install -r requirements.txt -q
          python -m unittest tests.test_core -v
