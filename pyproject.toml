[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-starter"
version = "0.1.0"
description = "A quantitative trading system for A-share factor investing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "quant-starter contributors" },
]
keywords = ["quantitative", "trading", "factor", "backtest", "a-share"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "lightgbm>=3.3.0",
    "akshare>=1.10.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "pyarrow>=10.0.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.6.0",
    "streamlit>=1.28.0",
]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "quant-starter[viz,dev]",
]

[project.scripts]
quant-backtest = "quant.cli:run_backtest"
quant-data = "quant.cli:fetch_data"

[project.urls]
Repository = "https://github.com/user/quant-starter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant = ["py.typed"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
