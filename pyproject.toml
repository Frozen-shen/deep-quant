[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-starter"
version = "0.1.0"
description = "A quantitative trading system for A-share factor investing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "quant-starter contributors" },
]
keywords = ["quantitative", "trading", "factor", "backtest", "a-share"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # ── 核心运行时依赖 (主代码路径 import; 下限参考当前实际安装版本) ──
    # 与 requirements.txt 保持一致 (同一套真实依赖)。
    "pandas>=3.0.0",
    "numpy>=2.0.0",
    "scipy>=1.18.0",
    "lightgbm>=4.7.0",
    "akshare>=1.18.0",
    "pyyaml>=6.0",
    "requests>=2.34.0",     # data_fetcher / alerter / fetch_daily_data
    "pyarrow>=25.0.0",      # 主代码 parquet 读写 (data/store.py, fetch_daily_data), 非仅 archive
    "matplotlib>=3.11.0",   # scripts/active/export_equity_curve.py
    "fastapi>=0.141.0",     # web/api 看板后端
    "uvicorn>=0.51.0",      # 运行 web/api (uvicorn web.api.main:app :8000)
    "httpx>=0.28.0",        # fastapi.testclient.TestClient 依赖
]

[project.optional-dependencies]
proxy = [
    # 东财接口代理网关 (eastmoney_proxy.py); 未安装则静默降级为直连, 故列为可选
    "akshare-proxy-patch>=0.5.0",
]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "quant-starter[proxy,dev]",
]

[project.urls]
Repository = "https://github.com/user/quant-starter"

[tool.setuptools.packages.find]
include = ["web*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
